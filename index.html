<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interior Design</title>
    <link rel="stylesheet" href="./node_modules/tippy.js/dist/tippy.css" />
    <link rel="stylesheet" href="./src/style.css" />
    <!-- Tippy.js reads process.env.NODE_ENV, which bundlers fill in; plain static serving needs this stand-in. -->
    <script>window.process ??= { env: { NODE_ENV: 'production' } };</script>
    <!-- Lets the page run from a plain static server (e.g. Live Server) too; Vite ignores this. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/",
          "tippy.js": "./node_modules/tippy.js/dist/tippy.esm.js",
          "@popperjs/core": "./node_modules/@popperjs/core/dist/esm/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport">
      <canvas id="c"></canvas>
      <div id="measure" class="measure" hidden></div>
    </div>

    <!-- Drawing / editing tools: vertical bar on the left edge. -->
    <nav class="tools">
      <button data-tool="select" class="icon" title="Select & edit (V)" aria-label="Select"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5 18.5 10l-6 1.8L10 18z"/><path d="m12.6 11.9 5 5.6"/></svg></button>
      <button data-tool="wall" class="icon" title="Draw walls (W)" aria-label="Wall"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 18 9 7 19 11"/><circle cx="4" cy="18" r="1.6" fill="currentColor"/><circle cx="9" cy="7" r="1.6" fill="currentColor"/><circle cx="19" cy="11" r="1.6" fill="currentColor"/></svg></button>
      <button data-tool="room" class="icon" title="Draw a rectangular room (R)" aria-label="Room"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14"/><circle cx="5" cy="5" r="1.6" fill="currentColor"/><circle cx="19" cy="19" r="1.6" fill="currentColor"/></svg></button>
      <button data-tool="person" class="icon" title="Place a person for scale (P)" aria-label="Person"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v7m0 0-3 6m3-6 3 6M7.5 11h9"/></svg></button>
    </nav>

    <header class="toolbar">
      <div class="group">
        <button id="file-open" class="icon" title="Open a design file (Ctrl+O), or drop one onto the page" aria-label="Open"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></button>
        <button id="file-save" class="icon" title="Save design to a file (Ctrl+S)" aria-label="Save"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10m-4-4 4 4 4-4"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg></button>
        <button id="screenshot" class="icon" title="Screenshot: save the 3D view as an image" aria-label="Screenshot"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.5-2h5.6l1.5 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button id="clear" class="icon" title="Clear scene: remove all walls and the person" aria-label="Clear scene"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button>
      </div>
      <div class="group">
        <button id="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button id="redo" class="icon" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      </div>
      <div class="group">
        <button id="home" class="icon" title="Home view: fit the whole scene (H)" aria-label="Home view"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9v10.5h4.5V15h3v4.5H18V9"/></svg></button>
        <button id="eye" class="icon" title="See through the person's eyes (E)" aria-label="Eye view"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="view" class="icon" title="Toggle top view (T)" aria-label="Top view"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h7V4M11 12v8"/></svg></button>
        <button id="parallel" class="icon" title="Parallel (orthographic) projection: no perspective distortion (O)" aria-label="Parallel"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg></button>
      </div>
    </header>

    <aside class="panel">
      <div class="scroll-shadow top" aria-hidden="true"></div>
      <details class="card" data-card="new-walls" open>
        <summary>New walls</summary>
        <div class="card-body">
          <label>Height (m) <input id="set-height" type="number" step="0.05" min="0.1" value="2.7" /></label>
          <label>Thickness (m) <input id="set-thickness" type="number" step="0.01" min="0.02" value="0.15" /></label>
          <label>Color <input id="set-color" type="color" value="#ffffff" /></label>
        </div>
      </details>
      <details class="card" data-card="view">
        <summary>View</summary>
        <div class="card-body">
          <label>FOV <output id="view-fov-value"></output></label>
          <input id="view-fov" type="range" min="20" max="100" step="1" />
          <label>Person height (m) <input id="person-height" type="number" step="0.05" min="0.5" max="2.5" /></label>
          <label>Walk speed <output id="person-speed-value"></output></label>
          <input id="person-speed" type="range" min="0.3" max="5" step="0.1" title="Hold Shift in eye view to go 2× faster" />
          <button id="person-remove" class="danger">Remove person</button>
        </div>
      </details>
      <details class="card" data-card="grid">
        <summary>Grid</summary>
        <div class="card-body">
          <label>Show <input id="grid-visible" type="checkbox" class="check" /></label>
          <label>Cell size
            <select id="grid-cell">
              <option value="0.05">5 cm</option>
              <option value="0.1">10 cm</option>
              <option value="0.25">25 cm</option>
              <option value="0.5">50 cm</option>
              <option value="1">1 m</option>
            </select>
          </label>
          <label>Major every
            <select id="grid-major">
              <option value="2">2 cells</option>
              <option value="4">4 cells</option>
              <option value="5">5 cells</option>
              <option value="10">10 cells</option>
            </select>
          </label>
          <label>Opacity <input id="grid-opacity" type="range" min="0.1" max="1" step="0.05" /></label>
          <label>Snap
            <select id="grid-snap">
              <option value="cell">Grid cell</option>
              <option value="half">½ cell</option>
              <option value="off">Off</option>
            </select>
          </label>
        </div>
      </details>
      <details class="card" data-card="scene">
        <summary>Scene</summary>
        <div class="card-body">
          <div id="scene-fields" class="fields"></div>
          <button id="scene-reset">Reset scene</button>
        </div>
      </details>
      <details class="card" data-card="rendering">
        <summary>Rendering</summary>
        <div class="card-body">
          <div id="render-fields" class="fields"></div>
          <button id="render-reset">Reset rendering</button>
        </div>
      </details>
      <div class="scroll-shadow bottom" aria-hidden="true"></div>
    </aside>

    <!-- Selection properties live on the left so the right panel never shifts. -->
    <aside class="panel left">
      <div id="sel-panel" class="card" hidden>
        <div class="card-header">
          <span>Selected wall</span>
          <button id="sel-close" class="card-close" title="Deselect (Esc)" aria-label="Deselect">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="card-body">
          <label>Length <output id="sel-length"></output></label>
          <label>Height (m) <input id="sel-height" type="number" step="0.05" min="0.1" /></label>
          <label>Thickness (m) <input id="sel-thickness" type="number" step="0.01" min="0.02" /></label>
          <label>Color <input id="sel-color" type="color" /></label>
          <button id="sel-delete" class="danger">Delete wall</button>
        </div>
      </div>
    </aside>

    <footer id="hint" class="hint"></footer>
    <div id="toast" class="toast" hidden></div>
    <div id="fps" class="fps" title="Frames per second · time per frame. Click to run performance diagnostics."></div>
    <div id="diag" class="diag" hidden>
      <h3>Performance diagnostics</h3>
      <pre id="diag-output"></pre>
      <div id="diag-actions" class="diag-actions" hidden>
        <button id="diag-download">Download report</button>
        <button id="diag-copy">Copy report</button>
        <button id="diag-close">Close</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
